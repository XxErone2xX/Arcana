<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcana</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 제목 표시줄 (창 테두리 없이 직접 그림, 드래그로 창 이동) -->
  <header class="titlebar" data-tauri-drag-region>
    <button class="icon-btn" id="btn-menu" title="메뉴">☰</button>
    <div class="brand" data-tauri-drag-region>
      <span class="sigil" data-tauri-drag-region>✦</span>
      <span class="wordmark" data-tauri-drag-region>ARCANA</span>
      <span class="version" id="version" data-tauri-drag-region></span>
    </div>
    <div class="win-btns">
      <button class="icon-btn" id="btn-min" title="최소화">─</button>
      <button class="icon-btn danger" id="btn-close" title="닫기">✕</button>
    </div>
  </header>

  <main id="log" class="log" aria-live="polite"></main>

  <section class="chips" id="chips"></section>

  <form class="composer corners" id="composer" autocomplete="off">
    <input id="input" placeholder="명령해줘…  예) 디코 켜줘" maxlength="200" />
    <button type="submit" class="send" title="보내기">➤</button>
  </form>

  <!-- 사이드 메뉴 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-panel corners">
      <h2>할 수 있는 것</h2>
      <ul id="caps" class="caps"></ul>

      <h2>설정</h2>
      <label class="toggle"><input type="checkbox" id="opt-debug" /> <span>AI 판단 과정 보기</span></label>
      <label class="toggle"><input type="checkbox" id="opt-update" /> <span>자동 업데이트</span></label>
      <div class="row">
        <button class="btn corners" id="btn-config">앱 목록 / 설정 파일 열기</button>
        <button class="btn corners" id="btn-reload">설정 다시 읽기</button>
      </div>

      <h2>정보</h2>
      <dl class="about" id="about"></dl>
      <button class="btn corners" id="btn-update">업데이트 확인</button>
    </div>
  </aside>

  <!-- 업데이트 중 화면 -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay-box corners">
      <div class="spinner"></div>
      <p id="overlay-text">업데이트 중…</p>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
