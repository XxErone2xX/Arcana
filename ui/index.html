<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcana</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 제목 표시줄 (드래그로 창 이동) -->
  <header class="titlebar" data-tauri-drag-region>
    <button class="icon-btn" id="btn-menu" title="메뉴">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="brand" data-tauri-drag-region>
      <span id="app-name" data-tauri-drag-region>Arcana</span>
      <span class="version" id="version" data-tauri-drag-region></span>
    </div>
    <nav class="tabs" data-tauri-drag-region>
      <button class="tab active" data-view="chat">대화</button>
      <button class="tab" data-view="study">학습<i class="dot" id="study-dot" hidden></i></button>
    </nav>
    <div class="spacer" data-tauri-drag-region></div>
    <div class="win-btns">
      <button class="icon-btn" id="btn-min" title="최소화">
        <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
      </button>
      <button class="icon-btn close" id="btn-close" title="닫기">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
  </header>

  <div class="view" id="view-chat">
  <main id="log" class="log" aria-live="polite">
    <!-- 첫 화면 -->
    <section class="welcome" id="welcome">
      <h1 id="welcome-title">무엇을 도와드릴까요?</h1>
      <div class="suggest" id="suggest"></div>
    </section>
  </main>

  <footer class="bottom">
    <form class="composer" id="composer" autocomplete="off">
      <input id="input" placeholder="Arcana에게 명령하기" maxlength="200" />
      <button type="submit" class="send" id="send" title="보내기" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
    <p class="hint">Enter로 보내기 · ↑ 이전 명령</p>
  </footer>
  </div>

  <!-- 학습 탭 -->
  <div class="view" id="view-study" hidden>
    <div class="study-head">
      <span class="pill" id="study-state">멈춤</span>
      <span class="study-stats" id="study-stats"></span>
    </div>
    <main class="feed" id="feed">
      <div class="feed-empty" id="feed-empty">
        <h1>스스로 학습</h1>
        <p><b>/Start</b> 를 입력하면 위키백과와 여러 웹사이트를 읽으며 스스로 공부합니다.<br />모르는 게 생기면 여기서 여쭤봅니다. <b>/</b> 를 입력하면 명령어 목록이 나옵니다.</p>
      </div>
    </main>
    <section class="question" id="question" hidden>
      <div class="q-label">Arcana의 질문</div>
      <div class="q-text" id="q-text"></div>
      <div class="q-actions"><button class="btn" id="q-skip" type="button">넘기기</button></div>
    </section>
    <footer class="bottom">
      <form class="composer" id="study-form" autocomplete="off">
        <input id="study-input" placeholder="/Start · /Stop · /Status · /Help 또는 질문에 대답" maxlength="300" />
        <button type="submit" class="send" id="study-send" title="보내기" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </form>
      <p class="hint">명령은 / 로 시작 · 그 외에는 질문에 대한 대답</p>
    </footer>
  </div>

  <!-- 사이드 메뉴 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-panel">
      <section>
        <h2>할 수 있는 것</h2>
        <ul id="caps" class="caps"></ul>
      </section>

      <section>
        <h2>설정</h2>
        <label class="switch"><span>AI 판단 과정 보기</span><input type="checkbox" id="opt-debug" /><i></i></label>
        <label class="switch"><span>자동 업데이트</span><input type="checkbox" id="opt-update" /><i></i></label>
        <div class="row">
          <button class="btn" id="btn-config">설정 파일 열기</button>
          <button class="btn" id="btn-reload">다시 읽기</button>
        </div>
      </section>

      <section>
        <h2>정보</h2>
        <dl class="about" id="about"></dl>
        <button class="btn" id="btn-update">업데이트 확인</button>
      </section>
    </div>
  </aside>

  <!-- 업데이트 중 화면 -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay-box">
      <div class="spinner"></div>
      <p id="overlay-text">업데이트 중…</p>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/study.js"></script>
</body>
</html>
