# 태그(v0.2.0 등)를 올리면 릴리스 자동 생성 → 사용자들 Arcana가 켤 때 자동 업데이트됨
#
# 릴리스하는 법:
#   1. Cargo.toml 의 [workspace.package] version 올리기 (예: 0.2.0)
#   2. docs/releases/v0.2.0.md 에 업데이트 내용 쓰기
#   3. git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 태그랑 Cargo.toml 버전이 같은지 확인
        shell: bash
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Cargo.toml 버전(v$V)과 태그(${GITHUB_REF_NAME})가 달라"; exit 1
          fi

      - run: cargo test -p arcana-core -p arcana-skills --release
      - run: cargo build -p arcana --release

      - name: 릴리스 만들기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "${GITHUB_REF_NAME}" target/release/Arcana.exe \
            --title "Arcana ${GITHUB_REF_NAME}" "${ARGS[@]}"
